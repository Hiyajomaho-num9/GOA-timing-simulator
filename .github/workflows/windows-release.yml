name: Windows tag build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Validate tag and application versions
        run: node scripts/prepare-windows-artifact.mjs --check-tag
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck, test, and build
        run: npm run check
      - name: Check dependency advisories
        run: npm audit --audit-level=high
      - name: Download pinned desktop runtimes
        run: npx neu update
      - name: Build embedded Windows executable
        run: npm run dist:win
      - name: Validate and collect Windows artifact
        run: node scripts/prepare-windows-artifact.mjs
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v7.0.1
        with:
          path: release/*.exe
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Upload checksums and build metadata
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-x64-${{ github.ref_name }}-metadata
          path: |
            release/*.sha256
            release/build-info.json
          if-no-files-found: error
          retention-days: 30
  publish:
    name: Publish GitHub Release
    needs: windows-x64
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Download this run's validated Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true
      - name: Publish EXE, checksum, and build metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish-github-release.mjs
