name: Windows tag build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
      - name: Validate tag and application versions
        run: node scripts/prepare-windows-artifact.mjs --check-tag
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck, test, and build
        run: npm run check
      - name: Check dependency advisories
        run: npm audit --audit-level=high
      - name: Download pinned desktop runtimes
        run: npx neu update
      - name: Build embedded Windows executable
        run: npm run dist:win
      - name: Validate and collect Windows artifact
        run: node scripts/prepare-windows-artifact.mjs
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v7.0.1
        with:
          path: release/*.exe
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Upload checksums and build metadata
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-x64-${{ github.ref_name }}-metadata
          path: |
            release/*.sha256
            release/build-info.json
          if-no-files-found: error
          retention-days: 30
